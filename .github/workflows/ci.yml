name: CI-CD Flask

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-build-security:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Ejecutar pruebas unitarias
        run: pytest -v

      - name: Verificar sintaxis
        run: python -m py_compile app.py

      - name: Construir imagen Docker
        run: docker build -t flask-hola-mundo:${{ github.sha }} .

      - name: Descargar Docker Bench Security
        run: |
          git clone https://github.com/docker/docker-bench-security.git
          chmod +x docker-bench-security/docker-bench-security.sh

      - name: Ejecutar Docker Bench Security
        run: |
          sudo sh docker-bench-security/docker-bench-security.sh || true

      - name: Iniciar sesión en Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Etiquetar imagen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag flask-hola-mundo:${{ github.sha }} aileen2003/flask-hola-mundo:latest
          docker tag flask-hola-mundo:${{ github.sha }} aileen2003/flask-hola-mundo:${{ github.sha }}

      - name: Publicar imagen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push aileen200/flask-hola-mundo:latest
          docker push aileen200/flask-hola-mundo:${{ github.sha }}
